name: Keycloak Sandbox Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_keycloak_client_secret: ${{ secrets.KEYCLOAK_SANDBOX_CLIENT_SECRET }}

jobs:
  keycloak-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keycloak-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::918084097805:role/dasharpe-terraform-hello-world-gha
          role-session-name: GitHubActions
          aws-region: ca-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
